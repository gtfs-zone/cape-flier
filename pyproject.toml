[project]
name = "cape-flier"
version = "0.9.0"
requires-python = ">=3.13"
description = "Static GTFS timetable sites for sites.gtfs.zone"
license = "AGPL-3.0-or-later"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# dagster pinned to geometry-car's: this is a code location in its instance.
pipeline = [
    "boto3>=1.35",
    "dagster==1.13.24",
    "dagster-postgres==0.29.24",
    "httpx>=0.27",
]
png = [
    "pillow>=11.0",
]

[project.scripts]
cape-flier = "cape_flier.cli:main"

[project.urls]
Homepage = "https://sites.gtfs.zone"
Source = "https://github.com/gtfs-zone/cape-flier"

[dependency-groups]
dev = [
    "commitizen",
    "dagster-webserver==1.13.24",
    "pre-commit",
    "pytest>=8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cape_flier"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true
bump_message = "chore(release): bump version $current_version -> $new_version"
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
