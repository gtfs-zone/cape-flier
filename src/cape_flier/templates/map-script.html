<script>
// Show the hovered or tapped stop or route's data-cap in the map's caption,
// highlight a stop's routes, and open the route of a stop on only one.
for (const map of document.querySelectorAll(".map")) {
  const cap = map.querySelector(".cap");
  const links = [...map.querySelectorAll("a")];
  const clear = () => {
    cap.hidden = true;
    for (const a of links) a.classList.remove("hl");
  };
  const show = (e) => {
    clear();
    const el = e.target.closest("[data-cap]");
    if (!el) return;
    cap.textContent = el.dataset.cap;
    cap.hidden = false;
    const routes = (el.dataset.routes || "").split(" ");
    for (const a of links) a.classList.toggle("hl", routes.includes(a.getAttribute("href")));
  };
  map.addEventListener("pointerover", show);
  map.addEventListener("focusin", show);
  // A tap's pointer leaves on lift, so only a mouse leaving clears the caption.
  map.addEventListener("pointerleave", (e) => {
    if (e.pointerType === "mouse") clear();
  });
  // On touch, the first tap on a stop shows its caption and a second opens it.
  let tapped = null;
  map.addEventListener("click", (e) => {
    const pin = e.target.closest(".pin");
    const routes = pin?.dataset.routes;
    const first = e.pointerType !== "mouse" && pin !== tapped;
    tapped = pin;
    if (routes && !routes.includes(" ") && !first) location.href = routes;
  });
}
</script>
