defaults:
  style: classic
  map: svg                 # svg | png | none
  horizon_days: 28         # window used to derive day types and effective dates
  time_format: 12h         # 12h | 24h
  orientation: stops-down  # stops-down (trips across) | trips-down
  timepoints: auto         # auto | all | timepoint-flag

# Each site takes either `feed:` (a feed id from data.gtfs.zone/feeds.json,
# resolved at build time) or `url:` (a direct GTFS zip URL), plus any option
# from `defaults` to override it.
sites:
  - slug: columbia-county
    feed: f-ff2cfa2434
    title: Columbia County Public Transportation
  - slug: amtrak
    feed: f-2f033a022e
    style: rail
  - slug: mbta-commuter-rail
    feed: f-1f748c5476
    routes: { route_types: [2] }
    title: MBTA Commuter Rail
